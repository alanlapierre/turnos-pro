# ===================================================================
# EXECUTION MODEL CONFIGURATION (PROJECT LOOM)
# ===================================================================
# Switches Tomcat and executors to use asynchronous Virtual Threads on the Heap
spring.threads.virtual.enabled=true

# ===================================================================
# HIKARICP TUNING (Cockcroft's Formula)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/saas_db
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Physical disk/CPU limit to prevent massive transactional degradation
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=10
# Queue tolerance (5 seconds) before triggering Fail-Fast to the HTTP client
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000

# ===================================================================
# FLYWAY BASELINE CONFIGURATION
# ===================================================================
# Automatically creates a baseline if the database is non-empty and lacks Flyway's tracking table
spring.flyway.baseline-on-migrate=true
# Initial version for pre-existing scripts (defaults to starting version count at V1)
spring.flyway.baseline-version=0

# ===================================================================
# RESILIENCE4J - RETRY CONFIGURATION
# ===================================================================
# Retry strategy defined for the reservation use case
resilience4j.retry.instances.reserveSlot.max-attempts=6
# Initial base wait time (300ms)
resilience4j.retry.instances.reserveSlot.wait-duration=300ms
# Enables Exponential Backoff (multiplies wait time on each failure)
resilience4j.retry.instances.reserveSlot.enable-exponential-backoff=true
resilience4j.retry.instances.reserveSlot.exponential-backoff-multiplier=2
# ENABLE JITTER (Randomization):
resilience4j.retry.instances.reserveSlot.enable-randomized-wait=true
resilience4j.retry.instances.reserveSlot.randomized-wait-factor=0.5
# Listens for both version collisions and transient connection/persistence timeouts
resilience4j.retry.instances.reserveSlot.retry-exceptions=java.util.ConcurrentModificationException

# ===================================================================
# OBSERVABILITY & ACTUATOR CONFIGURATION
# ===================================================================
# Exposes the telemetry and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Enables percentile histograms for Prometheus
management.metrics.distribution.percentiles-histogram.schedule.reservation=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Calibration of expected SLIs/SLAs for the reservation (time buckets)
management.metrics.distribution.slo.schedule.reservation=10ms,50ms,200ms,500ms,1000ms

# ===================================================================
# DISTRIBUTED TRACING (OpenTelemetry & W3C Trace Context)
# ===================================================================
# 100% sampling of traces for development and test environments
management.tracing.sampling.probability=1.0

# Structured Log formatting with automatic TraceId and SpanId
logging.pattern.level=%5p [${spring.application.name:turnos-pro},%X{traceId:-},%X{spanId:-}]